# Smart Campus OT Data Platform - local stack.
# Each service is a stand-in for its AWS counterpart (docs/adr/0001-local-first-aws-parity.md):
#   db        -> Aurora PostgreSQL      mqtt      -> AWS IoT Core
#   s3        -> S3 raw landing zone    ingest    -> IoT Rule + Lambda
#   grafana   -> operational dashboards metabase  -> self-service BI (optional, profile "bi")
name: smart-campus

x-platform-image: &platform-image
  image: smart-campus/platform:local
  build: .

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB}

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD}
      TRANSFORM_DB_PASSWORD: ${TRANSFORM_DB_PASSWORD}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}
      TIMESCALEDB_TELEMETRY: "off"
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_wal_size=2GB", "-c", "work_mem=32MB"]
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2.0.20
    ports: ["1883:1883"]
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  # S3-compatible object store (SeaweedFS, Apache-2.0). Auth is disabled locally;
  # in AWS the bucket is private and only the ingest Lambda's IAM role can write.
  s3:
    image: chrislusf/seaweedfs:3.85
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=256", "-volume.max=8"]
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # MQTT subscriber that micro-batches messages and invokes the *same* handler
  # that runs as the Lambda behind the IoT Rule in AWS.
  ingest:
    <<: *platform-image
    command: ["python", "-m", "smart_campus.bridge"]
    environment:
      <<: *db-env
      DB_USER: ingest_writer
      DB_PASSWORD: ${INGEST_DB_PASSWORD}
      MQTT_HOST: mqtt
      MQTT_TOPIC: campus/+/+/+/telemetry
      RAW_BUCKET: ${RAW_BUCKET}
      S3_ENDPOINT_URL: http://s3:8333
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: eu-west-2
    depends_on:
      db: {condition: service_healthy}
      s3: {condition: service_healthy}
      mqtt: {condition: service_started}
    restart: unless-stopped

  # Replays BDG2 readings as live device telemetry. Start with `make stream`.
  simulator:
    <<: *platform-image
    profiles: ["sim"]
    command: ["python", "-m", "smart_campus.simulator"]
    environment:
      MQTT_HOST: mqtt
      SITE_ID: ${SITE_ID}
      SIM_SPEEDUP: ${SIM_SPEEDUP}
      SIM_FAULT_RATE: ${SIM_FAULT_RATE}
      SIM_START: ${SIM_START}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      mqtt: {condition: service_started}

  # One-off jobs: extract, backfill, synthetic data, dbt, tests. `make <target>`.
  tools:
    <<: *platform-image
    profiles: ["tools"]
    working_dir: /app
    # Run as the host user so files written to the bind mount (data/, dbt target/) are writable.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      <<: *db-env
      HOME: /tmp
      # Loaders write raw as ingest_writer; dbt uses the transformer role
      # (warehouse/dbt/profiles.yml). The admin password never reaches job containers.
      DB_USER: ingest_writer
      DB_PASSWORD: ${INGEST_DB_PASSWORD}
      TRANSFORM_DB_PASSWORD: ${TRANSFORM_DB_PASSWORD}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}
      SITE_ID: ${SITE_ID}
      DBT_PROFILES_DIR: /app/warehouse/dbt
    volumes:
      - ./:/app
    depends_on:
      db: {condition: service_healthy}

  grafana:
    image: grafana/grafana-oss:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Local demo only: read-only anonymous viewing so stakeholders need no account.
      # In AWS this is replaced by SSO (IAM Identity Center / university Entra ID).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CAMPUS_DB_HOST: db
      CAMPUS_DB_SSLMODE: disable
    ports: ["3000:3000"]
    volumes:
      - ./dashboards/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.52.5
    profiles: ["bi"]
    environment:
      JAVA_OPTS: -Xmx768m
      MB_DB_FILE: /metabase-data/metabase.db
    ports: ["3001:3000"]
    volumes:
      - metabasedata:/metabase-data
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
  s3data:
  grafanadata:
  metabasedata:
