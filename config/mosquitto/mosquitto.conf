# Local MQTT broker standing in for AWS IoT Core.
# In AWS every device authenticates with its own X.509 certificate and an IoT policy
# scoped to campus/<site>/<building>/#. Locally we keep anonymous access on a
# loopback-only port for simplicity - see docs/adr/0001-local-first-aws-parity.md.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
